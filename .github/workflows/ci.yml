name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions-and-style:
    name: Validar Convencoes e Diretrizes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar ausencia de emojis e formato Conventional Commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi

          COMMITS=$(git log $RANGE --no-merges --pretty=format:"%s" 2>/dev/null || true)
          if [ -n "$COMMITS" ]; then
            echo "Verificando mensagens de commit:"
            echo "$COMMITS"

            if echo "$COMMITS" | grep -P '[\x{1F300}-\x{1F9FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}]'; then
              echo "Erro: Foram detectados emojis nas mensagens de commit."
              echo "Consulte .agents/rules/agentrules.md para a regra de proibicao estrita de emojis."
              exit 1
            fi

            while IFS= read -r line; do
              if [ -n "$line" ] && ! echo "$line" | grep -Eq '^(feat|fix|docs|test|refactor|chore|ci)(\([a-z0-9_-]+\))?: [^A-Z].*[^.]$'; then
                echo "Erro: Mensagem de commit fora do padrao Conventional Commits (caixa baixa e sem ponto final): $line"
                exit 1
              fi
            done <<< "$COMMITS"

            echo "Conformidade de commits aprovada: Conventional Commits e zero emojis."
          else
            echo "Nenhum commit adicional a validar em relacao a branch base."
          fi

  docs-quality:
    name: Validar Documentacao (MkDocs Strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache de dependencias pip
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ hashFiles('requirements.txt') }}
          path: ~/.cache/pip
          restore-keys: |
            mkdocs-material-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar build rigoroso do MkDocs
        run: mkdocs build --strict

  backend-laravel:
    name: Backend CI (Laravel 13 / PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP e Extensoes
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, pdo_pgsql, pgsql, redis, bcmath, curl, zip, dom
          coverage: none

      - name: Configurar Node.js para compilacao do manifesto Vite
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Validar integridade do composer.json
        run: composer validate --strict

      - name: Cache de dependencias Composer
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Instalar dependencias Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Preparar ambiente da aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Compilar assets Vite para testes de integracao Inertia
        run: |
          npm ci
          npm run build

      - name: Executar auditoria de seguranca de pacotes Composer
        run: composer audit

      - name: Executar verificacao de estilo (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Executar analise estatica de tipos (Larastan / PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=2G

      - name: Executar suite de testes automatizados (Pest)
        run: php artisan test

  frontend-vue:
    name: Frontend CI (Vue 3 / Inertia v3 / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP (necessario para Laravel Wayfinder)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath
          coverage: none

      - name: Cache de dependencias Composer
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Instalar dependencias Composer e preparar ambiente
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Instalar dependencias Node
        run: npm ci

      - name: Gerar rotas e tipos do Laravel Wayfinder
        run: php artisan wayfinder:generate --with-form

      - name: Validar formatacao e linting Frontend (Vite Plus Check)
        run: npm run check

      - name: Validar tipagem estatica TypeScript e Vue (vue-tsc)
        run: npm run types:check

      - name: Validar build de producao dos assets (Inertia + Vue 3 + Tailwind v4)
        run: npm run build
